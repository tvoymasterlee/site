<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>yonnilee · лотос</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">

<style>
:root {
  --rose:     #D4819A;
  --rose-lt:  #F4D6DF;
  --rose-dk:  #8B4560;
  --blush:    #F0C4CF;
  --mauve:    #9E7FA6;
  --gold:     #C9A96E;
  --gold-lt:  #F5EDD8;
  --cream:    #FAF4EF;
  --ink:      #2A1F2D;
  --ink-md:   #6B5773;
  --mist:     #F7F2F9;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }
html, body { overflow-x: hidden; }

body {
  background: var(--ink);
  color: var(--blush);
  font-family: 'Jost', sans-serif;
  font-weight: 300;
}

/* ── SILK BACKGROUND ── */
#silk-canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
  opacity: 0.55;
}

/* ── MAIN SCENE ── */
#scene-wrap {
  position: fixed;
  inset: 0;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  transition: opacity 0.3s ease;
}

#lotus-canvas {
  width: min(90vw, 90vh);
  height: min(90vw, 90vh);
}

/* ── SCROLL CONTAINER ── */
#scroll-container {
  position: relative;
  z-index: 2;
  height: 600vh;
}

/* ── CONTENT SECTIONS (appear on scroll) ── */
.content-section {
  position: relative;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transform: translateY(40px);
  transition: opacity 1s cubic-bezier(0.16,1,0.3,1), transform 1s cubic-bezier(0.16,1,0.3,1);
  padding: 40px 24px;
}

.content-section.visible {
  opacity: 1;
  transform: none;
}

/* First section — just the lotus, no text */
.section-lotus {
  pointer-events: none;
  height: 100vh;
  min-height: 100vh;
}

/* Label badge */
.eyebrow {
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--rose);
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.eyebrow::before {
  content: '';
  display: block;
  width: 20px;
  height: 0.5px;
  background: var(--rose);
}

/* Scroll hint */
#scroll-hint {
  position: fixed;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  opacity: 1;
  transition: opacity 0.6s;
}
#scroll-hint.hidden { opacity: 0; }

.scroll-hint-text {
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(240,196,207,0.5);
}

.scroll-hint-line {
  width: 1px;
  height: 40px;
  background: linear-gradient(to bottom, rgba(212,129,154,0.6), transparent);
  animation: scrollLine 1.8s ease-in-out infinite;
}

@keyframes scrollLine {
  0% { transform: scaleY(0); transform-origin: top; opacity: 0; }
  30% { transform: scaleY(1); transform-origin: top; opacity: 1; }
  60% { transform: scaleY(1); transform-origin: bottom; opacity: 1; }
  100% { transform: scaleY(0); transform-origin: bottom; opacity: 0; }
}

/* Progress indicator */
#lotus-progress {
  position: fixed;
  top: 50%;
  right: 28px;
  transform: translateY(-50%);
  z-index: 10;
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
}

.progress-dot {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: rgba(212,129,154,0.25);
  transition: background 0.4s, transform 0.4s;
}
.progress-dot.active {
  background: var(--rose);
  transform: scale(1.5);
}

/* Stage label */
#stage-label {
  position: fixed;
  bottom: 40px;
  right: 40px;
  z-index: 10;
  text-align: right;
  opacity: 0;
  transition: opacity 0.6s;
}
#stage-label.visible { opacity: 1; }

.stage-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1rem;
  font-style: italic;
  color: rgba(240,196,207,0.45);
  letter-spacing: 0.05em;
}

/* Logo */
#logo {
  position: fixed;
  top: 28px;
  left: 36px;
  z-index: 10;
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.5rem;
  font-style: italic;
  font-weight: 300;
  color: rgba(240,196,207,0.5);
  text-decoration: none;
  transition: color 0.3s;
}
#logo span { color: var(--rose); }
#logo:hover { color: rgba(240,196,207,0.9); }

/* Particle canvas */
#particle-canvas {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
}

/* ── INTRO SCREEN ── */
.section-intro {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  z-index: 3;
}

.intro-text-wrap {
  text-align: center;
  padding: 40px 24px;
  max-width: 600px;
}

.intro-eyebrow {
  font-size: 10px;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: var(--rose);
  margin-bottom: 32px;
  opacity: 0.7;
}

.intro-headline {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(3.2rem, 9vw, 7rem);
  font-weight: 300;
  line-height: 1.02;
  color: var(--blush);
  letter-spacing: -0.01em;
}
.intro-headline em {
  font-style: italic;
  color: var(--rose);
}

.intro-divider {
  width: 1px;
  height: 48px;
  background: linear-gradient(to bottom, var(--rose), transparent);
  margin: 36px auto 28px;
}

.intro-sub {
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: rgba(240,196,207,0.35);
}

/* ── CTA SCREEN ── */
.section-cta {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  z-index: 3;
  opacity: 0;
  transform: translateY(40px);
}

.cta-wrap {
  text-align: center;
  padding: 40px 24px;
  max-width: 520px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
}

.cta-ornament {
  font-size: 13px;
  letter-spacing: 0.3em;
  color: rgba(201,169,110,0.4);
  margin-bottom: 28px;
}

.cta-pre {
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: rgba(240,196,207,0.35);
  margin-bottom: 20px;
}

.cta-headline {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(2.4rem, 6vw, 4.2rem);
  font-weight: 300;
  line-height: 1.08;
  color: var(--blush);
  margin-bottom: 24px;
}
.cta-headline em {
  font-style: italic;
  color: var(--rose);
}

.cta-body {
  font-size: 14px;
  font-weight: 300;
  line-height: 1.8;
  color: rgba(240,196,207,0.5);
  margin-bottom: 44px;
}

.cta-btn {
  display: inline-flex;
  align-items: center;
  gap: 14px;
  padding: 18px 48px;
  background: transparent;
  border: 0.5px solid rgba(212,129,154,0.5);
  border-radius: 100px;
  text-decoration: none;
  color: var(--blush);
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.5rem;
  font-style: italic;
  font-weight: 300;
  letter-spacing: 0.06em;
  transition: all 0.5s cubic-bezier(0.16,1,0.3,1);
  position: relative;
  overflow: hidden;
  margin-bottom: 20px;
}
.cta-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at center, rgba(212,129,154,0.12), transparent 70%);
  opacity: 0;
  transition: opacity 0.4s;
}
.cta-btn:hover {
  border-color: var(--rose);
  color: #fff;
  transform: scale(1.04);
  box-shadow: 0 0 40px rgba(212,129,154,0.2);
}
.cta-btn:hover::before { opacity: 1; }

.cta-btn-text { position: relative; z-index: 1; }
.cta-btn-arrow {
  position: relative;
  z-index: 1;
  color: var(--rose);
  font-style: normal;
  transition: transform 0.4s;
}
.cta-btn:hover .cta-btn-arrow { transform: translateX(5px); }

.cta-handle {
  font-size: 11px;
  letter-spacing: 0.18em;
  color: rgba(212,129,154,0.35);
}

/* Radial glow */
#glow-orb {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 600px;
  height: 600px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(212,129,154,0.08) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
  animation: glowPulse 4s ease-in-out infinite;
}
@keyframes glowPulse {
  0%,100% { transform: translate(-50%,-50%) scale(1); opacity: 0.7; }
  50% { transform: translate(-50%,-50%) scale(1.12); opacity: 1; }
}
</style>

<script>
/* ═══════════════════════════════════════════
   КОМАНДА:
   ПРОГРАММИСТ — Three-like lotus on Canvas 2D
   ДИЗАЙНЕР — формы лепестков, палитра Yoni
   ═══════════════════════════════════════════ */

/* ── SILK BACKGROUND ── */
(function initSilk() {
  const canvas = document.getElementById('silk-canvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // Silk ribbons
  const ribbons = Array.from({ length: 7 }, (_, i) => ({
    y: (i / 6) * 1.2 - 0.1,
    phase: Math.random() * Math.PI * 2,
    speed: 0.0004 + Math.random() * 0.0003,
    amp: 0.08 + Math.random() * 0.12,
    freq: 0.8 + Math.random() * 0.6,
    thick: 60 + Math.random() * 100,
    hue: i % 2 === 0 ? [212,129,154] : [158,127,166],
  }));

  let t = 0;
  function drawSilk() {
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    // Dark background
    ctx.fillStyle = '#2A1F2D';
    ctx.fillRect(0, 0, w, h);

    // Ribbons
    ribbons.forEach(r => {
      const baseY = r.y * h;
      ctx.beginPath();
      ctx.moveTo(-10, baseY);

      for (let x = 0; x <= w + 10; x += 4) {
        const nx = x / w;
        const y = baseY + Math.sin(nx * r.freq * Math.PI + r.phase + t) * r.amp * h;
        ctx.lineTo(x, y);
      }

      const grad = ctx.createLinearGradient(0, baseY - r.thick/2, 0, baseY + r.thick/2);
      grad.addColorStop(0,   `rgba(${r.hue.join(',')},0)`);
      grad.addColorStop(0.5, `rgba(${r.hue.join(',')},0.06)`);
      grad.addColorStop(1,   `rgba(${r.hue.join(',')},0)`);

      ctx.strokeStyle = grad;
      ctx.lineWidth = r.thick;
      ctx.stroke();
    });

    t += 0.003;
    requestAnimationFrame(drawSilk);
  }
  drawSilk();
})();

/* ── PARTICLE DUST ── */
(function initParticles() {
  const canvas = document.getElementById('particle-canvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const motes = Array.from({ length: 60 }, () => ({
    x: Math.random(),
    y: Math.random(),
    r: 0.5 + Math.random() * 1.8,
    vx: (Math.random() - 0.5) * 0.0002,
    vy: -0.00005 - Math.random() * 0.0001,
    phase: Math.random() * Math.PI * 2,
    speed: 0.003 + Math.random() * 0.008,
    col: [[212,129,154],[201,169,110],[240,196,207]][Math.floor(Math.random()*3)],
  }));

  function drawParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const w = canvas.width, h = canvas.height;

    motes.forEach(m => {
      m.x += m.vx;
      m.y += m.vy;
      if (m.y < -0.02) { m.y = 1.02; m.x = Math.random(); }
      if (m.x < -0.02) m.x = 1.02;
      if (m.x > 1.02)  m.x = -0.02;

      const alpha = 0.06 + 0.12 * Math.sin(Date.now() * m.speed * 0.001 + m.phase);
      ctx.beginPath();
      ctx.arc(m.x * w, m.y * h, m.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${m.col.join(',')},${alpha})`;
      ctx.fill();
    });

    requestAnimationFrame(drawParticles);
  }
  drawParticles();
})();

/* ══════════════════════════════════════════════════════
   LOTUS ENGINE
   Многоуровневый лотос на Canvas 2D
   Лепестки раскрываются через scroll → openProgress [0..1]
   ══════════════════════════════════════════════════════ */
(function initLotus() {
  const canvas = document.getElementById('lotus-canvas');
  const ctx = canvas.getContext('2d');

  const SIZE = 800;
  canvas.width  = SIZE;
  canvas.height = SIZE;

  const cx = SIZE / 2, cy = SIZE / 2;

  /* Palette from Yoni design system */
  const C = {
    rose:    [212, 129, 154],
    roseDk:  [139,  69,  96],
    blush:   [240, 196, 207],
    mauve:   [158, 127, 166],
    gold:    [201, 169, 110],
    cream:   [250, 240, 228],
    mist:    [247, 242, 249],
  };
  const rgba = ([r,g,b], a) => `rgba(${r},${g},${b},${a})`;

  /* ── PETAL DRAWING ──
     One petal = one bezier-loop shape
     angle    = orientation
     r        = center distance
     len      = petal length
     wid      = petal width factor
     openAng  = how much it's "lifted" (rotation out of plane = simulated by stretch)
     alpha    = opacity
  */
  function drawPetal(ctx, x, y, len, wid, angle, curl, col, alpha, highlight) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);

    /*
      ФОРМА: органический мягкий лепесток — широкое основание,
      полное тело, плавно закруглённый кончик без острия.
      Вдохновлено природными формами — листья магнолии, лепестки пиона.

      Конструкция:
      - основание широкое, мягко сужается с двух сторон
      - тело выпуклое, максимум ширины на 40% длины
      - кончик — полная дуга, без точки
      - лёгкий боковой изгиб через curl
    */

    const w  = wid;                  // полуширина у основания
    const w2 = wid * 1.35;           // максимум ширины (середина лепестка)
    const tip = -len;                // кончик
    const mid = -len * 0.42;         // уровень максимальной ширины
    const topZone = -len * 0.78;     // верхняя треть — начало скругления
    const c = len * curl * 0.5;      // боковое смещение от curl

    ctx.beginPath();

    // Правая сторона — снизу вверх
    ctx.moveTo(w * 0.3,  0);                              // нижний правый угол (мягкий)
    ctx.bezierCurveTo(
      w + c * 0.3,   -len * 0.15,                        // вспух правого бока
      w2 + c,         mid,                               // макс ширина справа
      w2 * 0.55 + c,  topZone                            // сужение перед кончиком
    );

    // Кончик — плавная дуга, без точки
    ctx.bezierCurveTo(
      w2 * 0.2 + c,  tip + len * 0.08,
      -w2 * 0.2 + c, tip + len * 0.08,
      -w2 * 0.55 + c, topZone
    );

    // Левая сторона — сверху вниз
    ctx.bezierCurveTo(
      -w2 + c,        mid,
      -w - c * 0.3,  -len * 0.15,
      -w * 0.3,       0
    );

    // Основание — мягкая дуга (не острый угол)
    ctx.bezierCurveTo(
      -w * 0.15,   len * 0.04,
       w * 0.15,   len * 0.04,
       w * 0.3,    0
    );

    ctx.closePath();

    // ── ЗАЛИВКА — радиальный градиент от центра: тёмный корень → светлый кончик
    const grad = ctx.createLinearGradient(0, 0, c * 0.4, tip);
    grad.addColorStop(0,    rgba(C.roseDk, alpha * 0.95));
    grad.addColorStop(0.18, rgba(col,      alpha));
    grad.addColorStop(0.55, rgba(C.blush,  alpha * 0.9));
    grad.addColorStop(0.82, rgba(C.mist,   alpha * 0.75));
    grad.addColorStop(1,    rgba(C.cream,  alpha * 0.4));
    ctx.fillStyle = grad;
    ctx.fill();

    // ── ВНУТРЕННЯЯ ПОДСВЕТКА — имитация толщины лепестка
    const innerGrad = ctx.createRadialGradient(c * 0.3, mid * 0.6, 0, c * 0.3, mid * 0.6, w2 * 0.9);
    innerGrad.addColorStop(0,   rgba(C.cream, alpha * 0.22));
    innerGrad.addColorStop(0.5, rgba(C.blush, alpha * 0.08));
    innerGrad.addColorStop(1,   rgba(C.rose,  0));
    ctx.fillStyle = innerGrad;
    ctx.fill();

    // ── ПРОЖИЛКА — центральная, чуть изогнутая
    if (highlight) {
      ctx.beginPath();
      ctx.moveTo(0, -len * 0.04);
      ctx.bezierCurveTo(
        c * 0.2,  mid * 0.5,
        c * 0.35, topZone * 0.9,
        c * 0.3,  tip * 0.94
      );
      ctx.strokeStyle = rgba(C.blush, alpha * 0.28);
      ctx.lineWidth = 0.9;
      ctx.stroke();

      // Боковые прожилки
      [-1, 1].forEach(side => {
        ctx.beginPath();
        ctx.moveTo(side * w * 0.15, -len * 0.12);
        ctx.quadraticCurveTo(
          side * (w2 * 0.55 + c * 0.5), mid * 0.75,
          side * (w2 * 0.3 + c * 0.4),  topZone * 0.85
        );
        ctx.strokeStyle = rgba(C.blush, alpha * 0.12);
        ctx.lineWidth = 0.5;
        ctx.stroke();
      });
    }

    // ── КОНТУР — мягкое свечение края
    ctx.beginPath();
    ctx.moveTo(w * 0.3, 0);
    ctx.bezierCurveTo(w + c * 0.3, -len * 0.15, w2 + c, mid, w2 * 0.55 + c, topZone);
    ctx.bezierCurveTo(w2 * 0.2 + c, tip + len * 0.08, -w2 * 0.2 + c, tip + len * 0.08, -w2 * 0.55 + c, topZone);
    ctx.bezierCurveTo(-w2 + c, mid, -w - c * 0.3, -len * 0.15, -w * 0.3, 0);
    ctx.strokeStyle = rgba(C.blush, alpha * 0.2);
    ctx.lineWidth = 0.8;
    ctx.stroke();

    ctx.restore();
  }

  /* ── LOTUS LAYERS ──
     p = progress 0..1 (scroll-driven)
     Layer 0 (outermost) — 12 petals — opens first
     Layer 1             —  8 petals — opens second
     Layer 2             —  5 petals — opens third
     Layer 3 (inner bud) —  3 petals — opens last
  */

  const LAYERS = [
    {
      count: 12,
      baseR: 198,
      openR: 228,
      closedR: 18,
      len: 122,
      closedLen: 42,
      wid: 40,        // широкий телесный лепесток
      startProgress: 0.0,
      fullProgress:  0.45,
      col: C.rose,
      curl: 0.08,     // меньше curl — форма симметричнее
    },
    {
      count: 8,
      baseR: 148,
      openR: 168,
      closedR: 13,
      len: 102,
      closedLen: 34,
      wid: 34,
      startProgress: 0.2,
      fullProgress:  0.6,
      col: C.rose,
      curl: 0.10,
    },
    {
      count: 5,
      baseR: 94,
      openR: 110,
      closedR: 10,
      len: 82,
      closedLen: 28,
      wid: 28,
      startProgress: 0.45,
      fullProgress:  0.78,
      col: C.mauve,
      curl: 0.12,
    },
    {
      count: 3,
      baseR: 52,
      openR: 60,
      closedR: 7,
      len: 56,
      closedLen: 20,
      wid: 20,
      startProgress: 0.65,
      fullProgress:  0.92,
      col: C.blush,
      curl: 0.14,
    },
  ];

  /* smoothstep for easing */
  function smoothstep(a, b, x) {
    const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
    return t * t * (3 - 2 * t);
  }

  /* State */
  let openProgress = 0;   // 0 = closed, 1 = fully open
  let targetProgress = 0;
  let animT = 0;

  /* ── DRAW FULL LOTUS ── */
  function drawLotus(t) {
    ctx.clearRect(0, 0, SIZE, SIZE);

    const p = openProgress;

    /* Water shimmer rings */
    [280, 310, 340].forEach((r, i) => {
      const a = 0.04 + 0.02 * Math.sin(animT * 0.5 + i * 1.3);
      ctx.beginPath();
      ctx.arc(cx, cy, r + Math.sin(animT * 0.3 + i) * 4, 0, Math.PI * 2);
      ctx.strokeStyle = rgba(C.mauve, a);
      ctx.lineWidth = 0.5;
      ctx.stroke();
    });

    /* Aura glow */
    const auraR = 220 + p * 80;
    const aura = ctx.createRadialGradient(cx, cy, 0, cx, cy, auraR);
    aura.addColorStop(0,   rgba(C.rose, 0.07 + p * 0.06));
    aura.addColorStop(0.5, rgba(C.mauve, 0.04));
    aura.addColorStop(1,   rgba(C.rose, 0));
    ctx.fillStyle = aura;
    ctx.beginPath();
    ctx.arc(cx, cy, auraR, 0, Math.PI * 2);
    ctx.fill();

    /* Draw layers back to front */
    [...LAYERS].reverse().forEach((layer, li) => {
      const layerIdx = LAYERS.length - 1 - li;
      const lp = smoothstep(layer.startProgress, layer.fullProgress, p);

      // Current radius = lerp from closed to open
      const r   = layer.closedR + (layer.baseR - layer.closedR) * lp;
      // Current petal length
      const len = layer.closedLen + (layer.len - layer.closedLen) * lp;
      // Current angle spread — petals "lift" as they open
      const liftAngle = (1 - lp) * 1.1; // simulates depth by compressing petals

      for (let i = 0; i < layer.count; i++) {
        const baseAngle = (i / layer.count) * Math.PI * 2;
        const wobble = 0.015 * Math.sin(animT * 0.4 + i * 1.7 + layerIdx);
        const angle  = baseAngle + wobble;

        const px = cx + Math.cos(angle) * r;
        const py = cy + Math.sin(angle) * r;

        // Petal points AWAY from center
        const petalAngle = angle + Math.PI / 2;

        // Simulate 3D lift: compress width when closed
        const wFactor = 0.3 + lp * 0.7;
        const wid = layer.wid * wFactor;

        // Alpha
        const alpha = 0.1 + lp * 0.75 + 0.04 * Math.sin(animT * 0.3 + i);

        // Curl increases as petals open
        const curl = layer.curl * lp;

        drawPetal(ctx, px, py, len, wid, petalAngle, curl, layer.col, alpha, lp > 0.5);
      }
    });

    /* Centre: stamen ring */
    const stamAlpha = smoothstep(0.5, 0.85, p);
    if (stamAlpha > 0) {
      for (let i = 0; i < 10; i++) {
        const a = (i / 10) * Math.PI * 2 + animT * 0.08;
        const sr = 22 + 5 * Math.sin(animT * 0.5 + i);
        const sx = cx + Math.cos(a) * sr;
        const sy = cy + Math.sin(a) * sr;
        ctx.beginPath();
        ctx.arc(sx, sy, 2, 0, Math.PI * 2);
        ctx.fillStyle = rgba(C.gold, stamAlpha * (0.6 + 0.3 * Math.sin(animT + i)));
        ctx.fill();
        // Filament
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(sx, sy);
        ctx.strokeStyle = rgba(C.gold, stamAlpha * 0.15);
        ctx.lineWidth = 0.6;
        ctx.stroke();
      }
    }

    /* Centre bud / bindu */
    const budR = 8 + p * 6;
    const budGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, budR * 2);
    budGrad.addColorStop(0,   rgba(C.cream, 0.95));
    budGrad.addColorStop(0.5, rgba(C.rose,  0.7));
    budGrad.addColorStop(1,   rgba(C.roseDk,0.3));
    ctx.beginPath();
    ctx.arc(cx, cy, budR * 1.4, 0, Math.PI * 2);
    ctx.fillStyle = budGrad;
    ctx.fill();

    // Bindu (sacred dot)
    ctx.beginPath();
    ctx.arc(cx, cy, 3 + p * 2, 0, Math.PI * 2);
    ctx.fillStyle = rgba(C.gold, 0.95);
    ctx.fill();

    /* Soft sparkles at petal tips */
    if (p > 0.3) {
      const sparkAlpha = smoothstep(0.3, 0.7, p);
      for (let l = 0; l < 2; l++) {
        const layer = LAYERS[l];
        const lp2 = smoothstep(layer.startProgress, layer.fullProgress, p);
        for (let i = 0; i < layer.count; i++) {
          const angle = (i / layer.count) * Math.PI * 2;
          const tipR = layer.closedR + (layer.baseR - layer.closedR) * lp2 + layer.len * lp2;
          const tx2 = cx + Math.cos(angle) * tipR * 0.88;
          const ty2 = cy + Math.sin(angle) * tipR * 0.88;
          const sa = sparkAlpha * (0.2 + 0.15 * Math.sin(animT * 1.2 + i * 0.8 + l * 2));
          ctx.beginPath();
          ctx.arc(tx2, ty2, 1.5, 0, Math.PI * 2);
          ctx.fillStyle = rgba(C.gold, sa);
          ctx.fill();
        }
      }
    }

    animT += 0.016;
  }

  /* ── SCROLL DRIVER ── */
  const stages = ['бутон', 'раскрытие', 'расцвет', 'полнота', 'сияние'];
  const dots = document.querySelectorAll('.progress-dot');
  const stageLabel = document.getElementById('stage-label');
  const stageNameEl = document.getElementById('stage-name-text');
  const scrollHint = document.getElementById('scroll-hint');
  const sceneWrap = document.getElementById('scene-wrap');
  const ctaSection = document.querySelector('.section-cta');

  function onScroll() {
    const scrollY = window.scrollY;
    const totalH = document.getElementById('scroll-container').offsetHeight;
    const maxScroll = totalH - window.innerHeight;
    const scrollFrac = Math.max(0, Math.min(1, scrollY / maxScroll));

    // Лотос анимируется только по первым ~83% скролла (до CTA-секции)
    const lotusFrac = Math.max(0, Math.min(1, scrollFrac / 0.83));
    targetProgress = lotusFrac;

    // Progress dots
    const activeIdx = Math.floor(lotusFrac * 4.99);
    dots.forEach((d, i) => d.classList.toggle('active', i === activeIdx));

    // Stage label
    const si = Math.floor(lotusFrac * (stages.length - 0.01));
    stageNameEl.textContent = stages[si];
    stageLabel.classList.toggle('visible', scrollY > 100 && scrollFrac < 0.88);

    // Scroll hint
    scrollHint.classList.toggle('hidden', scrollY > 80);

    // Лотос тихо уходит когда CTA входит в экран
    const fadeStart = 0.80;
    const fadeEnd   = 0.92;
    const lotusOpacity = scrollFrac < fadeStart ? 1
      : scrollFrac > fadeEnd ? 0
      : 1 - (scrollFrac - fadeStart) / (fadeEnd - fadeStart);
    sceneWrap.style.opacity = lotusOpacity;

    // CTA появляется
    if (ctaSection) {
      const ctaVisible = scrollFrac > 0.82;
      ctaSection.style.opacity = ctaVisible
        ? Math.min(1, (scrollFrac - 0.82) / 0.1)
        : 0;
      ctaSection.style.transform = ctaVisible
        ? `translateY(${Math.max(0, (1 - (scrollFrac - 0.82) / 0.12)) * 40}px)`
        : 'translateY(40px)';
    }
  }

  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll(); // init

  /* ── ANIMATION LOOP ── */
  function animate() {
    // Smooth lerp to target
    openProgress += (targetProgress - openProgress) * 0.06;
    drawLotus(animT);
    requestAnimationFrame(animate);
  }

  animate();
})();
</script>

</body>
</html>
